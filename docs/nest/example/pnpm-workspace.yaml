# 独立示例项目：不参与仓库根的 pnpm workspace。
# minimumReleaseAge=0：教程示例需要立即使用最新 Nest 12 / Vite 8 依赖，
# 关闭 pnpm 11 默认的“发布未满 24 小时不安装”策略。
minimumReleaseAge: 0
verifyDepsBeforeRun: false

allowBuilds:
  # 只有 esbuild 的安装脚本是构建链必需的（tsx/esbuild 二进制）；
  # scarf 只上报下载统计，workerd 属于 Cloudflare 工具链，示例不用。
  '@scarf/scarf': false
  esbuild: true
  workerd: false
